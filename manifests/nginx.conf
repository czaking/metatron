# Metatron 内网站点导航台 —— nginx 站点配置(挂到 /etc/nginx/conf.d/default.conf)
#
# 纯静态单文件站:整站就是一个 index.html(内联 CSS/JS/自研二维码编码器)。
# 关键点:
#   - charset utf-8:显式回 Content-Type; charset=utf-8,给 Safari 兜底(它不猜编码,
#     否则中文乱码)。meta 标签已有,这里是第二道保险。
#   - gzip:56KB 文本压到 ~15KB,内网也顺手。
#   - try_files → /index.html:任何路径都回同一个页面(前端纯本地路由/无路由都安全)。
server {
    listen       80;
    server_name  _;

    charset utf-8;
    charset_types text/html text/css application/javascript image/svg+xml;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri /index.html;
        # HTML 不缓存(改一版立刻可见);Pod 滚动本身也会带新内容
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
