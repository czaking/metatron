# Metatron 内网站点导航台 —— 内网 ALB Ingress(metatron.example.com)
#
# 链路(同 nacos-config-history/manifests/ingress.yaml):
#   metatron.example.com(Cloudflare 灰云 DNS,指向内网 ALB 私网 IP)
#     → alb-internal HTTPS:443(cert-manager 签发证书,ALB 终止 TLS)
#     → metatron Service:80 → nginx 直出静态页
#
# TLS:cert-manager.io/cluster-issuer letsencrypt-prod 触发 ingress shim 自动建
#   Certificate,DNS-01(Cloudflare)签发,落到下方 tls.secretName;阿里云 ALB
#   Ingress Controller 监听该 Secret 绑到 HTTPS:443(charts/alb-internal 已含该监听器)。
#
# DNS:ExternalDNS 读 rules[].host 同步到 Cloudflare;proxied=false —— 内网私网 IP
#   不能走橙云代理,只做 DNS 解析,访问需在 VPC 内或连飞连 VPN。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metatron
  annotations:
    # 同时挂 HTTP:80 与 HTTPS:443,配合 ssl-redirect 让 http:// 自动 301 跳 https://
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  ingressClassName: alb-internal
  tls:
    - hosts:
        - metatron.example.com
      secretName: metatron-example-com-tls
  rules:
    - host: metatron.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metatron
                port:
                  number: 80
