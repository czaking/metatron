# Metatron 内网站点导航台 —— Deployment
#
# 纯静态站:stock nginx:alpine(nexus 已在用同镜像,public 可直接拉,无需 ACR)。
# 无状态、无凭据,双副本 + RollingUpdate 即可。站点内容全部来自两个由
# kustomization configMapGenerator 生成的 ConfigMap(带哈希后缀):
#   - metatron-html  → /usr/share/nginx/html/index.html
#   - metatron-nginx → /etc/nginx/conf.d/default.conf
# 改 HTML → CM 哈希变 → 这里的 volume 引用被 kustomize 自动改写 → Pod 滚动。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metatron
  labels:
    app: metatron
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metatron
  template:
    metadata:
      labels:
        app: metatron
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: html
          configMap:
            name: metatron-html
        - name: nginx-conf
          configMap:
            name: metatron-nginx
